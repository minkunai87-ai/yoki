<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>나만의 안키 (Deck Menu Fix)</title>
<style>
    /* 기본 테마 유지 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --primary: #4dabf7; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --text-sub: #a0a0a0; --border: #333333; --input-bg: #2c2c2c; --btn-hover: #383838; --sub-group-bg: #252525; }
    body { font-family: 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    /* 헤더 */
    .header { background: var(--surface); padding: 0 15px; padding-top: calc(env(safe-area-inset-top) + 15px); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 20; flex-shrink: 0; position: relative; }
    .header-left { display: flex; gap: 15px; align-items: center; }
    .header-title { font-weight: bold; font-size: 1.1rem; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 50vw; }
    .header-controls { display: flex; gap: 10px; align-items: center; }
    .menu-btn, .filter-toggle-btn { font-size: 1.5rem; cursor: pointer; background: none; border: none; padding: 0; color: var(--text); display: flex; align-items: center; justify-content: center; }
    .filter-toggle-btn { color: var(--primary); } 
    .counter { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); background: var(--input-bg); padding: 5px 12px; border-radius: 15px; }

    /* 필터 바 (Layout Push) */
    .filter-bar { 
        width: 100%; background: var(--surface); 
        display: flex; gap: 10px; overflow-x: auto; 
        z-index: 15; scrollbar-width: none; 
        max-height: 0; opacity: 0; overflow-y: hidden;
        transition: all 0.3s ease-in-out;
        padding: 0 15px;
        border-bottom: 0px solid var(--border);
    }
    .filter-bar.open { 
        max-height: 65px; opacity: 1; 
        padding: 12px 15px;
        border-bottom: 1px solid var(--border);
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip { 
        background: var(--input-bg); border: 1px solid var(--border); 
        padding: 8px 14px; border-radius: 20px; color: var(--text-sub); 
        font-size: 0.85rem; font-weight: bold; cursor: pointer; 
        white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; gap: 6px; transition: 0.2s;
    }
    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    .filter-chip.sort-chip { border-color: #5c5c5c; color: #e0e0e0; background: #333; }
    .filter-chip.sort-chip.active { background: #fcc419; color: #000; border-color: #fcc419; }

    /* 사이드바 */
    .sidebar { position: fixed; top: 0; left: 0; width: 300px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); box-shadow: 2px 0 15px rgba(0,0,0,0.5); transition: transform 0.3s ease; z-index: 9999; padding: 25px; padding-top: calc(env(safe-area-inset-top) + 25px); display: flex; flex-direction: column; overflow-y: auto; transform: translateX(-105%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; display: none; }
    .sidebar-overlay.open { display: block; }
    
    .menu-section { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .menu-label { font-weight: bold; color: var(--text-sub); margin-bottom: 10px; display: block; font-size: 0.95rem; }
    .search-box { position: relative; margin-bottom: 15px; }
    .search-input { width: 100%; padding: 12px 10px 12px 35px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 8px; font-size: 0.95rem; }
    .search-input:focus { border-color: var(--primary); outline: none; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

    .deck-list { list-style: none; padding: 0; margin: 0; }
    .tree-folder { margin-bottom: 4px; }
    .tree-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; cursor: pointer; background: var(--input-bg); border: 1px solid var(--border); transition: 0.2s; margin-bottom: 4px; }
    .tree-header:hover { background: var(--btn-hover); }
    .tree-children { display: none; padding-left: 10px; margin-left: 8px; border-left: 2px solid #444; }
    .tree-children.open { display: block; }
    .folder-title { flex: 1; font-weight: bold; color: #ffd43b; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .tree-deck { padding: 12px; border-radius: 8px; cursor: pointer; background: var(--input-bg); margin-bottom: 4px; color: var(--text); font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .tree-deck.active { background: #182836; color: #74c0fc; font-weight: bold; border: 2px solid #1c7ed6; }
    .play-btn { background: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; margin-left: 8px; flex-shrink: 0; }
    .del-btn { background: none; border: none; color: var(--text-sub); font-weight: bold; padding: 0 5px; cursor: pointer; font-size: 1rem; }

    .btn-upload, .backup-btn, .restore-btn, .refresh-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); text-align: left; }
    .btn-upload { background: var(--primary); color: white; border: none; text-align: center; }
    .backup-btn { background: #343a40; color: white; border: none; text-align: center; }
    .restore-btn { background: #495057; color: white; border: none; text-align: center; }
    .refresh-btn { background: #212529; color: var(--text-sub); border: 1px solid var(--border); text-align: center; margin-top: 10px; }
    .sort-btn.active-filter { border: 2px solid var(--primary); background: #182836; color: var(--primary); }

    .main-container { flex: 1; display: flex; flex-direction: column; padding: 0; width: 100%; position: relative; overflow: hidden; background: var(--bg); }
    .card { background: var(--surface); width: 100%; height: 100%; max-width: none; border-radius: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .card-scroll-area { flex: 1; padding: 25px 20px; overflow-y: auto; }
    
    .card-info { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); align-items: center; }
    .info-left { display: flex; gap: 8px; align-items: center; }
    .rate-badge { font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; background: var(--input-bg); color: var(--text-sub); }
    .rate-badge.high { background: #0b2e13; color: #69db7c; } .rate-badge.low { background: #2e0b0b; color: #ff8787; }
    .date-badge { font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; display: none; }
    .badge-today { background: #0b2e13; color: #40c057; border: 1px solid #40c057; } 
    .badge-1d { background: #3f2e05; color: #ffd43b; border: 1px solid #ffd43b; } 
    .badge-old { background: #212529; color: #868e96; border: 1px solid #495057; } 

    .icon-wrapper { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
    .icon-row { display: flex; gap: 12px; }
    .icon-btn { font-size: 1.4rem; cursor: pointer; background: none; border: none; padding: 0; line-height: 1; color: var(--text-sub); transition: 0.2s; opacity: 0.4; filter: grayscale(100%); }
    .icon-btn.active { opacity: 1; filter: grayscale(0%); transform: scale(1.1); }
    .mem-btn.active { color: #ff8787; } .cmp-btn.active { color: #74c0fc; } .fav-btn.active { color: #ffd43b; }
    .num-btn.active { color: #66d9e8; } .date-btn.active { color: #b197fc; } .pen-btn.active { color: #ff6b6b; }
    .edit-btn { font-size: 1.2rem; margin-right: 5px; opacity: 1; color: var(--text-sub); }

    .text-area { font-size: 1.35rem; line-height: 1.6; word-break: keep-all; white-space: pre-wrap; width: 100%; margin-bottom: 20px; color: var(--text); font-weight: 500; position: relative; overflow-x: hidden; }
    table { table-layout: fixed !important; width: 100% !important; max-width: 100% !important; display: table !important; }
    .text-area *, .img-area * { max-width: 100% !important; box-sizing: border-box !important; }
    img { border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); max-width: 100% !important; height: auto !important; display: block; margin: 10px auto; }

    .divider { display: none; border: 0; border-top: 2px dashed var(--border); margin: 30px 0; position: relative; }
    .divider::after { content: "정답"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 10px; color: var(--text-sub); font-size: 0.8rem; font-weight: bold; }
    #answer-section { display: none; padding-bottom: 20px; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .footer { width: 100%; padding: 10px 20px; padding-bottom: calc(35px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); z-index: 10; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    .nav-btns, .grade-btns { display: flex; justify-content: space-between; width: 100%; margin: 0; gap: 12px; }
    .nav-btn { flex: 1; background: var(--input-bg); border: 1px solid var(--border); padding: 14px 0; border-radius: 12px; cursor: pointer; font-weight: bold; color: var(--text); font-size: 1rem; text-align: center; }
    .g-btn { flex: 1; padding: 16px 0; border: none; border-radius: 12px; font-weight: bold; color: white; cursor: pointer; font-size: 1.1rem; }
    .bg-x { background: #fa5252; } .bg-tri { background: #fab005; } .bg-o { background: #40c057; }

    .click-guide { text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-top: 40px; cursor: pointer; padding: 30px; border: 2px dashed var(--border); border-radius: 12px; background: #181818; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
    .modal-content { background: var(--surface); width: 90%; max-width: 500px; padding: 25px; border-radius: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; }
    .edit-input { width: 100%; padding: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 8px; min-height: 80px; }
    .ox-highlight { font-size: 4rem; font-weight: 900; text-align: center; display: block; margin: 10px 0; }
    .ox-o { color: #40c057; } .ox-x { color: #fa5252; }
</style>
</head>
<body>

    <div class="sidebar-overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <h2 style="margin-top:0; color:var(--text); font-size:1.4rem;">⚙️ 메뉴</h2>
        <div class="menu-section">
            <span class="menu-label">🔍 카드 검색</span>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="텍스트, OCR, 태그 검색" onkeyup="filterCards()">
            </div>
        </div>
        <div class="menu-section">
            <span class="menu-label">덱 관리</span>
            <ul class="deck-list" id="deck-list-ui"></ul>
        </div>
        <div class="menu-section">
            <span class="menu-label">설정</span>
            <button class="refresh-btn" onclick="location.reload()">🔄 사이트 새로고침</button>
            <button class="refresh-btn" style="margin-top:5px;" onclick="exportData()">💾 백업 저장</button>
        </div>
        <div style="margin-top:auto; font-size:0.8rem; color:var(--text-sub); text-align:center;">My Anki v10.52 (Menu Fix)</div>
    </div>

    <div class="header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <button class="filter-toggle-btn" onclick="toggleFilterBar()">🌪️</button>
        </div>
        <div class="header-title" id="deck-title">나만의 안키</div>
        <div class="header-controls">
            <span class="counter" id="card-counter">0 / 0</span>
        </div>
    </div>

    <div class="filter-bar" id="filter-bar">
        <div class="filter-chip sort-chip active" id="sort-original" onclick="setSortMode('original')">🔄 원래순</div>
        <div class="filter-chip sort-chip" id="sort-wrong" onclick="setSortMode('wrong')">🔥 오답순</div>
        <div style="width:1px; height:20px; background:var(--border); flex-shrink:0;"></div>
        <div class="filter-chip active" id="filter-default" onclick="setFilterMode('default')">📋 전체</div>
        <div class="filter-chip" id="filter-mem" onclick="setFilterMode('mem')">🧠 암기</div>
        <div class="filter-chip" id="filter-cmp" onclick="setFilterMode('cmp')">🆚 비교</div>
        <div class="filter-chip" id="filter-fav" onclick="setFilterMode('fav')">⭐ 중요</div>
        <div class="filter-chip" id="filter-num" onclick="setFilterMode('num')">🔢 숫자</div>
        <div class="filter-chip" id="filter-date" onclick="setFilterMode('date')">📅 날짜</div>
        <div class="filter-chip" id="filter-pen" onclick="setFilterMode('pen')">🚨 벌칙</div>
    </div>

    <div class="main-container">
        <div class="card">
            <div class="card-scroll-area" id="scroll-area">
                <div id="loading" style="display:none; text-align:center; padding-top:50px;">로딩 중...</div>
                <div class="card-info" id="card-info">
                    <div class="info-left"><span class="rate-badge" id="rate-badge">New</span><span class="date-badge" id="date-badge"></span></div>
                    <div class="icon-wrapper">
                        <div class="icon-row">
                            <button class="icon-btn edit-btn" onclick="openEditModal(event)">✏️</button>
                            <button class="icon-btn mem-btn" id="mem-btn" onclick="toggleTag(event, 'mem')">🧠</button>
                            <button class="icon-btn cmp-btn" id="cmp-btn" onclick="toggleTag(event, 'cmp')">🆚</button>
                            <button class="icon-btn fav-btn" id="fav-btn" onclick="toggleTag(event, 'fav')">⭐</button>
                        </div>
                        <div class="icon-row">
                            <button class="icon-btn num-btn" id="num-btn" onclick="toggleTag(event, 'num')">🔢</button>
                            <button class="icon-btn date-btn" id="date-btn" onclick="toggleTag(event, 'date')">📅</button>
                            <button class="icon-btn pen-btn" id="pen-btn" onclick="toggleTag(event, 'pen')">🚨</button>
                        </div>
                    </div>
                </div>
                <div id="question-section" class="content-box"></div>
                <div id="click-guide" class="click-guide" onclick="revealAnswer()">👇 터치하여 정답 확인</div>
                <hr id="divider" class="divider">
                <div id="answer-section" class="content-box"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="grade-btns" id="grade-area">
            <button class="g-btn bg-x" onclick="grade(0)">모름</button>
            <button class="g-btn bg-tri" onclick="grade(1)">애매</button>
            <button class="g-btn bg-o" onclick="grade(2)">맞음</button>
        </div>
        <div class="nav-btns" id="nav-area">
            <button class="nav-btn" onclick="moveCard(-1)">◀ 이전</button>
            <button class="nav-btn" onclick="moveCard(1)">다음 ▶</button>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <textarea id="edit-q" class="edit-input"></textarea>
            <textarea id="edit-a" class="edit-input"></textarea>
            <button class="nav-btn" style="background:var(--primary); color:white;" onclick="saveEdit()">저장</button>
            <button class="nav-btn" onclick="closeEditModal()">취소</button>
        </div>
    </div>

<script>
    const repoOwner = 'minkunai87-ai', repoName = 'yoki'; 
    const githubRawBase = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/images/`;
    let library = {}, currentDeckName = null, originalDeck = [], activeDeck = [], currentIndex = 0;
    let currentFilterMode = 'default', currentSortMode = 'original', imageMap = new Map();
    const STORAGE_KEY_LIBRARY = 'anki_final_library', STORAGE_KEY_STATS = 'anki_final_stats', STORAGE_KEY_PROGRESS = 'anki_final_progress_v2', STORAGE_KEY_LAST_DECK = 'anki_final_last_deck';

    window.onload = async function() { await autoScanGitHub(); };

    async function autoScanGitHub() {
        document.getElementById('loading').style.display = 'block';
        try {
            const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
            const files = (await res.json()).filter(f => f.name.endsWith('.txt'));
            for (const file of files) {
                const text = await (await fetch(file.download_url + '?t=' + Date.now())).text();
                processAnkiText(text, file.name);
            }
        } catch (e) {}
        
        // 렌더링 순서 중요: 덱 목록 생성 후 -> 마지막 덱 로드
        renderDeckTree(); 
        document.getElementById('loading').style.display = 'none';
        
        const last = localStorage.getItem(STORAGE_KEY_LAST_DECK);
        if (last && library[last]) {
            selectDeck(last);
        } else if (Object.keys(library).length) {
            selectDeck(Object.keys(library)[0]);
        }
    }

    function processAnkiText(text, filename) {
        const lines = text.split(/\r?\n/);
        let deck = filename.replace('.txt', '');
        lines.forEach(l => {
            if(!l.trim() || l.startsWith('#')) return;
            const parts = l.split('\t');
            if(parts.length < 2) return;
            if(!library[deck]) library[deck] = [];
            const q = parts[0], a = parts.slice(1).join('<br>');
            library[deck].push({ id: cyrb53(q), q, a });
        });
    }

    function createDOM(rawText, isAnswer) {
        const temp = document.createElement('div'); temp.innerHTML = rawText.replace(/""/g, '"');
        temp.querySelectorAll('*').forEach(el => {
            el.style.width = el.style.height = ""; el.style.maxWidth = "100%";
            if(['TABLE','TD','TH'].includes(el.tagName)) { el.style.tableLayout = "fixed"; el.style.width = "100%"; }
        });
        const wrap = document.createElement('div'); wrap.className = 'text-area';
        let txt = temp.textContent.trim();
        if(isAnswer && (txt.startsWith('O') || txt.startsWith('X'))) {
            const ox = document.createElement('span'); ox.className = `ox-highlight ${txt[0]==='O'?'ox-o':'ox-x'}`;
            ox.innerText = txt[0]; wrap.appendChild(ox);
        }
        wrap.appendChild(temp);
        wrap.querySelectorAll('img').forEach(img => {
            let src = img.getAttribute('src') || img.textContent;
            img.src = imageMap.get(src) || (githubRawBase + encodeURIComponent(src));
        });
        return wrap;
    }

    function applyFilterAndSort() {
        if(!currentDeckName) return;
        const stats = JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}');
        let filtered = [...originalDeck];
        if(currentFilterMode !== 'default') filtered = filtered.filter(c => (stats[c.id] || {})[currentFilterMode]);
        if(currentSortMode === 'wrong') filtered.sort((a,b) => {
            const sA = stats[a.id] || {correct:0, total:0}, sB = stats[b.id] || {correct:0, total:0};
            const rA = sA.total === 0 ? 1 : (sA.correct / sA.total), rB = sB.total === 0 ? 1 : (sB.correct / sB.total);
            return rA - rB;
        });
        activeDeck = filtered; currentIndex = loadProgress();
        if(currentIndex >= activeDeck.length) currentIndex = 0;
        
        // 덱 리스트 업데이트 (Active 표시용)
        renderDeckTree(); 
        showCard();
    }

    function setFilterMode(mode) {
        currentFilterMode = mode;
        document.querySelectorAll('.filter-chip:not(.sort-chip)').forEach(c => c.classList.toggle('active', c.id === `filter-${mode}`));
        applyFilterAndSort();
    }

    function setSortMode(mode) {
        currentSortMode = mode;
        document.querySelectorAll('.sort-chip').forEach(c => c.classList.toggle('active', c.id === `sort-${mode}`));
        applyFilterAndSort();
    }

    function toggleFilterBar() { document.getElementById('filter-bar').classList.toggle('open'); }

    function selectDeck(name) { 
        currentDeckName = name; originalDeck = library[name]; 
        localStorage.setItem(STORAGE_KEY_LAST_DECK, name);
        document.getElementById('deck-title').innerText = name.split('__').pop();
        applyFilterAndSort();
    }

    function selectDeckGroup(prefix) {
        let merged = [];
        Object.keys(library).forEach(key => { if (key.startsWith(prefix) || key === prefix.replace('__', '')) merged = merged.concat(library[key]); });
        if (!merged.length) return;
        currentDeckName = prefix.replace(/__$/, ''); originalDeck = merged;
        localStorage.setItem(STORAGE_KEY_LAST_DECK, currentDeckName);
        document.getElementById('deck-title').innerText = currentDeckName.split('__').pop() + " (전체)";
        applyFilterAndSort();
        toggleMenu(); // 메뉴 닫기
    }

    // 🔥 [복구된 렌더링 로직 + 자동 펼침]
    function renderDeckTree() {
        const list = document.getElementById('deck-list-ui'); list.innerHTML = '';
        const names = Object.keys(library).sort();
        const tree = {};
        names.forEach(path => {
            const parts = path.split('__'); let cur = tree;
            parts.forEach((p, i) => {
                if(!cur[p]) cur[p] = { _path: parts.slice(0, i+1).join('__'), _children: {}, _isLeaf: (i === parts.length-1) };
                cur = cur[p]._children;
            });
        });
        function createDOMTree(node, cont) {
            Object.keys(node).sort().forEach(k => {
                const item = node[k]; const hasChildren = Object.keys(item._children).length > 0;
                const li = document.createElement('li');
                if(hasChildren) {
                    li.className = 'tree-folder';
                    const head = document.createElement('div'); head.className = 'tree-header';
                    head.innerHTML = `<div class="folder-title">📂 ${k}</div> <button class="play-btn">▶ 전체</button>`;
                    head.onclick = () => { li.querySelector('.tree-children').classList.toggle('open'); };
                    head.querySelector('.play-btn').onclick = (e) => { e.stopPropagation(); selectDeckGroup(item._path + '__'); };
                    const childCont = document.createElement('ul'); childCont.className = 'tree-children';
                    
                    // 현재 보고 있는 덱이 이 폴더 안에 있다면 자동으로 펼치기
                    if(currentDeckName && (currentDeckName.startsWith(item._path + '__') || currentDeckName === item._path)) {
                        childCont.classList.add('open');
                    }
                    
                    li.appendChild(head); li.appendChild(childCont); cont.appendChild(li);
                    createDOMTree(item._children, childCont);
                } else {
                    li.className = `tree-deck ${item._path === currentDeckName ? 'active' : ''}`;
                    li.innerHTML = `<span>📄 ${k}</span>`;
                    li.onclick = () => { selectDeck(item._path); toggleMenu(); };
                    cont.appendChild(li);
                }
            });
        }
        createDOMTree(tree, list);
    }

    // 🔥 [메뉴 토글 시 현재 위치로 스크롤]
    function toggleMenu() { 
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        const isOpen = sidebar.classList.toggle('open'); 
        overlay.classList.toggle('open');
        
        if (isOpen) {
            setTimeout(() => {
                const activeEl = document.querySelector('.tree-deck.active');
                if (activeEl) {
                    activeEl.scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 100);
        }
    }

    function saveCurrentProgress() {
        const key = `${currentDeckName}__${currentFilterMode}__${currentSortMode}`;
        const p = JSON.parse(localStorage.getItem(STORAGE_KEY_PROGRESS) || '{}');
        p[key] = currentIndex; localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(p));
    }
    function loadProgress() {
        const key = `${currentDeckName}__${currentFilterMode}__${currentSortMode}`;
        return JSON.parse(localStorage.getItem(STORAGE_KEY_PROGRESS) || '{}')[key] || 0;
    }
    function getStats(id) { return JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}')[id] || {correct:0, total:0}; }
    function toggleTag(e, type) { 
        e.stopPropagation(); const id = activeDeck[currentIndex].id;
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}');
        if(!data[id]) data[id] = { correct: 0, total: 0 };
        data[id][type] = !data[id][type]; localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(data));
        updateIconsUI(data[id]);
    }
    function updateIconsUI(s) { ['mem','cmp','fav','num','date','pen'].forEach(t => document.getElementById(`${t}-btn`).classList.toggle('active', !!s[t])); }
    function filterCards() { 
        const q = document.getElementById('search-input').value.toLowerCase();
        if(!q) { applyFilterAndSort(); return; }
        activeDeck = originalDeck.filter(c => c.q.toLowerCase().includes(q) || c.a.toLowerCase().includes(q));
        currentIndex = 0; showCard();
    }
    const cyrb53 = (str, seed = 0) => { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };
    function openEditModal(e) { e.stopPropagation(); const c = activeDeck[currentIndex]; document.getElementById('edit-q').value=c.q; document.getElementById('edit-a').value=c.a; document.getElementById('edit-modal').style.display='flex'; }
    function closeEditModal() { document.getElementById('edit-modal').style.display='none'; }
    function saveEdit() { const c = activeDeck[currentIndex]; c.q = document.getElementById('edit-q').value; c.a = document.getElementById('edit-a').value; closeEditModal(); showCard(); }
    function exportData() { const blob = new Blob([JSON.stringify(localStorage)], {type:'application/json'}); const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='anki_backup.json'; a.click(); }
</script>
