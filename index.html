<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>나만의 안키 (v10.53 Fix)</title>
<style>
    /* 기본 테마 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --primary: #4dabf7; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --text-sub: #a0a0a0; --border: #333333; --input-bg: #2c2c2c; --btn-hover: #383838; }
    body { font-family: 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    /* 헤더 */
    .header { background: var(--surface); padding: 0 15px; padding-top: calc(env(safe-area-inset-top) + 15px); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 20; flex-shrink: 0; }
    .header-left { display: flex; gap: 15px; align-items: center; }
    .header-title { font-weight: bold; font-size: 1.1rem; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 50vw; }
    .header-controls { display: flex; gap: 10px; align-items: center; }
    .menu-btn, .filter-toggle-btn { font-size: 1.5rem; cursor: pointer; background: none; border: none; padding: 0; color: var(--text); }
    .filter-toggle-btn { color: var(--primary); } 
    .counter { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); background: var(--input-bg); padding: 5px 12px; border-radius: 15px; }

    /* 필터 바 (안전하게 헤더 아래 배치) */
    .filter-bar { 
        width: 100%; background: var(--surface); 
        display: none; gap: 10px; overflow-x: auto; 
        z-index: 15; scrollbar-width: none; 
        padding: 12px 15px; border-bottom: 1px solid var(--border);
        animation: slideDown 0.2s ease-out;
    }
    .filter-bar.open { display: flex; }
    @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .filter-chip { 
        background: var(--input-bg); border: 1px solid var(--border); 
        padding: 8px 14px; border-radius: 20px; color: var(--text-sub); 
        font-size: 0.85rem; font-weight: bold; cursor: pointer; 
        white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; gap: 6px; 
    }
    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    .filter-chip.sort-chip { border-color: #5c5c5c; color: #e0e0e0; background: #333; }
    .filter-chip.sort-chip.active { background: #fcc419; color: #000; border-color: #fcc419; }

    /* 사이드바 (폴더 구조 스타일) */
    .sidebar { position: fixed; top: 0; left: 0; width: 300px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); box-shadow: 2px 0 15px rgba(0,0,0,0.5); transition: transform 0.3s ease; z-index: 9999; padding: 25px; padding-top: calc(env(safe-area-inset-top) + 25px); display: flex; flex-direction: column; overflow-y: auto; transform: translateX(-105%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; display: none; }
    .sidebar-overlay.open { display: block; }
    
    .menu-section { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .deck-list { list-style: none; padding: 0; margin: 0; }
    
    /* 트리 구조 스타일 */
    .tree-folder { margin-bottom: 4px; }
    .tree-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; cursor: pointer; background: var(--input-bg); border: 1px solid var(--border); margin-bottom: 4px; }
    .tree-children { display: none; padding-left: 15px; margin-left: 5px; border-left: 2px solid #444; }
    .tree-children.open { display: block; }
    .folder-title { flex: 1; font-weight: bold; color: #ffd43b; font-size: 0.95rem; }
    .tree-deck { padding: 12px; border-radius: 8px; cursor: pointer; background: var(--input-bg); margin-bottom: 4px; color: var(--text); font-size: 0.9rem; }
    
    /* 🔥 현재 덱 강조 */
    .tree-deck.active { background: #182836; color: #74c0fc; font-weight: bold; border: 2px solid #1c7ed6; }
    .play-btn { background: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

    /* 메인 카드 영역 */
    .main-container { flex: 1; display: flex; flex-direction: column; padding: 0; width: 100%; position: relative; overflow: hidden; background: var(--bg); }
    .card { background: var(--surface); width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .card-scroll-area { flex: 1; padding: 25px 20px; overflow-y: auto; }
    
    .card-info { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); align-items: center; }
    .info-left { display: flex; gap: 8px; align-items: center; }
    .rate-badge, .date-badge { font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; }
    .rate-badge { background: var(--input-bg); color: var(--text-sub); }
    .badge-today { background: #0b2e13; color: #40c057; border: 1px solid #40c057; } 
    .badge-1d { background: #3f2e05; color: #ffd43b; border: 1px solid #ffd43b; } 
    .badge-old { background: #212529; color: #868e96; border: 1px solid #495057; } 

    .text-area { font-size: 1.4rem; line-height: 1.6; word-break: keep-all; white-space: pre-wrap; width: 100%; margin-bottom: 20px; color: var(--text); font-weight: 500; }
    .text-area img { max-width: 100%; height: auto; display: block; margin: 10px auto; border-radius: 8px; }
    
    .divider { border-top: 2px dashed var(--border); margin: 30px 0; position: relative; display: none; }
    .divider::after { content: "정답"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 10px; color: var(--text-sub); font-size: 0.8rem; font-weight: bold; }
    #answer-section { display: none; padding-bottom: 20px; }

    .footer { width: 100%; padding: 10px 20px; padding-bottom: calc(35px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); z-index: 10; display: flex; flex-direction: column; gap: 10px; }
    .nav-btns, .grade-btns { display: flex; justify-content: space-between; width: 100%; gap: 12px; }
    .nav-btn, .g-btn { flex: 1; padding: 14px 0; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; border: none; }
    .nav-btn { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
    .g-btn { color: white; font-size: 1.1rem; }
    .bg-x { background: #fa5252; } .bg-tri { background: #fab005; } .bg-o { background: #40c057; }

    .click-guide { text-align: center; color: var(--text-sub); padding: 30px; border: 2px dashed var(--border); border-radius: 12px; background: #181818; margin-top: 20px; cursor: pointer; }
    .icon-row { display: flex; gap: 10px; }
    .icon-btn { font-size: 1.4rem; background: none; border: none; cursor: pointer; opacity: 0.4; filter: grayscale(100%); transition: 0.2s; }
    .icon-btn.active { opacity: 1; filter: grayscale(0%); transform: scale(1.1); }
</style>
</head>
<body>

    <div class="sidebar-overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <h2 style="margin-top:0; color:var(--text); font-size:1.4rem;">⚙️ 메뉴</h2>
        <div class="menu-section">
            <span style="font-size:0.9rem; color:var(--text-sub);">🔍 검색</span>
            <input type="text" id="search-input" style="width:100%; padding:10px; margin-top:5px; border-radius:8px; border:1px solid #333; background:#2c2c2c; color:#fff;" placeholder="카드 검색" onkeyup="filterCards()">
        </div>
        <div class="menu-section">
            <span style="font-size:0.9rem; color:var(--text-sub);">📚 덱 목록</span>
            <ul class="deck-list" id="deck-list-ui"></ul>
        </div>
        <div style="margin-top:auto; text-align:center; color:#666; font-size:0.8rem;">My Anki v10.53 (Fix)</div>
    </div>

    <div class="header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <button class="filter-toggle-btn" onclick="toggleFilterBar()">🌪️</button>
        </div>
        <div class="header-title" id="deck-title">나만의 안키</div>
        <div class="header-controls">
            <span class="counter" id="card-counter">0 / 0</span>
        </div>
    </div>

    <div class="filter-bar" id="filter-bar">
        <div class="filter-chip sort-chip active" id="sort-original" onclick="setSortMode('original')">🔄 원래순</div>
        <div class="filter-chip sort-chip" id="sort-wrong" onclick="setSortMode('wrong')">🔥 오답순</div>
        <div style="width:1px; height:20px; background:var(--border); flex-shrink:0;"></div>
        <div class="filter-chip active" id="filter-default" onclick="setFilterMode('default')">📋 전체</div>
        <div class="filter-chip" id="filter-mem" onclick="setFilterMode('mem')">🧠 암기</div>
        <div class="filter-chip" id="filter-cmp" onclick="setFilterMode('cmp')">🆚 비교</div>
        <div class="filter-chip" id="filter-fav" onclick="setFilterMode('fav')">⭐ 중요</div>
        <div class="filter-chip" id="filter-num" onclick="setFilterMode('num')">🔢 숫자</div>
        <div class="filter-chip" id="filter-date" onclick="setFilterMode('date')">📅 날짜</div>
        <div class="filter-chip" id="filter-pen" onclick="setFilterMode('pen')">🚨 벌칙</div>
    </div>

    <div class="main-container">
        <div class="card">
            <div class="card-scroll-area" id="scroll-area">
                <div id="loading" style="display:none; text-align:center; padding-top:50px;">데이터 로딩 중...</div>
                
                <div class="card-info" id="card-info">
                    <div class="info-left">
                        <span class="rate-badge" id="rate-badge">New</span>
                        <span class="date-badge" id="date-badge" style="display:none;"></span>
                    </div>
                    <div class="icon-wrapper">
                        <div class="icon-row">
                            <button class="icon-btn mem-btn" id="mem-btn" onclick="toggleTag(event, 'mem')">🧠</button>
                            <button class="icon-btn cmp-btn" id="cmp-btn" onclick="toggleTag(event, 'cmp')">🆚</button>
                            <button class="icon-btn fav-btn" id="fav-btn" onclick="toggleTag(event, 'fav')">⭐</button>
                        </div>
                    </div>
                </div>

                <div id="question-section" class="text-area"></div>
                
                <div id="click-guide" class="click-guide" onclick="revealAnswer()">👇 터치하여 정답 확인</div>
                
                <hr id="divider" class="divider">
                <div id="answer-section" class="text-area"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="grade-btns" id="grade-area" style="display:none;">
            <button class="g-btn bg-x" onclick="grade(0)">모름</button>
            <button class="g-btn bg-tri" onclick="grade(1)">애매</button>
            <button class="g-btn bg-o" onclick="grade(2)">맞음</button>
        </div>
        <div class="nav-btns" id="nav-area">
            <button class="nav-btn" onclick="moveCard(-1)">◀ 이전</button>
            <button class="nav-btn" onclick="moveCard(1)">다음 ▶</button>
        </div>
    </div>

<script>
    const repoOwner = 'minkunai87-ai';
    const repoName = 'yoki';
    const githubRawBase = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/images/`;

    let library = {}, currentDeckName = null, originalDeck = [], activeDeck = [], currentIndex = 0;
    let currentFilterMode = 'default', currentSortMode = 'original';
    const STORAGE_KEY_STATS = 'anki_final_stats', STORAGE_KEY_PROGRESS = 'anki_final_progress_v2', STORAGE_KEY_LAST_DECK = 'anki_final_last_deck';

    window.onload = async function() { await autoScanGitHub(); };

    async function autoScanGitHub() {
        document.getElementById('loading').style.display = 'block';
        try {
            const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
            const files = (await res.json()).filter(f => f.name.endsWith('.txt'));
            for (const file of files) {
                const text = await (await fetch(file.download_url + '?t=' + Date.now())).text();
                processAnkiText(text, file.name);
            }
        } catch (e) { console.log(e); }
        
        renderDeckTree();
        document.getElementById('loading').style.display = 'none';
        
        const last = localStorage.getItem(STORAGE_KEY_LAST_DECK);
        if (last && library[last]) selectDeck(last); 
        else if (Object.keys(library).length > 0) selectDeck(Object.keys(library)[0]);
    }

    // 🔥 [핵심] :: 또는 __ 를 기준으로 덱 이름 분리
    function processAnkiText(text, filename) {
        const lines = text.split(/\r?\n/);
        // 파일명에 있는 .txt 제거
        let baseDeckName = filename.replace('.txt', '');
        
        lines.forEach(line => {
            if(!line.trim() || line.startsWith('#')) return;
            const parts = line.split('\t');
            
            // TSV 형식: DeckName(옵션) \t Question \t Answer
            let deckNameInRow = baseDeckName;
            let q, a;

            if (parts.length >= 3) {
                // 3열 이상이면 첫번째 열을 덱 이름으로 사용 (:: 를 __ 로 변환)
                deckNameInRow = parts[0].replace(/::/g, '__'); 
                q = parts[1];
                a = parts.slice(2).join('<br>');
            } else if (parts.length === 2) {
                q = parts[0];
                a = parts[1];
            } else { return; }

            if (!library[deckNameInRow]) library[deckNameInRow] = [];
            library[deckNameInRow].push({ id: cyrb53(q), q, a });
        });
    }

    // 🔥 [핵심] 트리 구조 렌더링 (폴더 만들기)
    function renderDeckTree() {
        const list = document.getElementById('deck-list-ui'); list.innerHTML = '';
        const names = Object.keys(library).sort();
        const tree = {};

        // 1. 트리 객체 생성
        names.forEach(path => {
            const parts = path.split('__'); 
            let cur = tree;
            parts.forEach((part, i) => {
                if(!cur[part]) cur[part] = { _path: parts.slice(0, i+1).join('__'), _children: {}, _isLeaf: (i === parts.length-1) };
                cur = cur[part]._children;
            });
        });

        // 2. DOM 생성 (재귀)
        function createDOMTree(node, container) {
            Object.keys(node).sort().forEach(k => {
                const item = node[k];
                const hasChildren = Object.keys(item._children).length > 0;
                const li = document.createElement('li');

                if (hasChildren) {
                    li.className = 'tree-folder';
                    // 폴더 헤더
                    const head = document.createElement('div'); head.className = 'tree-header';
                    head.innerHTML = `<div class="folder-title">📂 ${k}</div> <button class="play-btn">▶ 전체</button>`;
                    
                    // 폴더 열기/닫기
                    head.onclick = () => { li.querySelector('.tree-children').classList.toggle('open'); };
                    // 전체 풀기
                    head.querySelector('.play-btn').onclick = (e) => { 
                        e.stopPropagation(); 
                        selectDeckGroup(item._path + '__'); 
                    };

                    const childCont = document.createElement('ul'); childCont.className = 'tree-children';
                    
                    // 🔥 현재 덱이 이 폴더 안에 있으면 자동으로 펼치기
                    if (currentDeckName && (currentDeckName.startsWith(item._path + '__') || currentDeckName === item._path)) {
                        childCont.classList.add('open');
                    }

                    li.appendChild(head);
                    li.appendChild(childCont);
                    container.appendChild(li);
                    
                    createDOMTree(item._children, childCont); // 재귀 호출
                } else {
                    // 단일 덱
                    li.className = `tree-deck ${item._path === currentDeckName ? 'active' : ''}`;
                    li.innerHTML = `<span>📄 ${k}</span>`;
                    li.onclick = () => { selectDeck(item._path); toggleMenu(); };
                    container.appendChild(li);
                }
            });
        }
        createDOMTree(tree, list);
    }

    function selectDeck(name) {
        if (!library[name]) return;
        currentDeckName = name;
        originalDeck = library[name];
        localStorage.setItem(STORAGE_KEY_LAST_DECK, name);
        document.getElementById('deck-title').innerText = name.split('__').pop();
        applyFilterAndSort();
    }

    function selectDeckGroup(prefix) {
        let merged = [];
        Object.keys(library).forEach(key => {
            // 접두어로 시작하는 모든 덱 합치기
            if (key.startsWith(prefix)) {
                merged = merged.concat(library[key]);
            }
        });
        if (merged.length === 0) { alert('하위 덱이 없습니다.'); return; }
        
        currentDeckName = prefix.replace(/__$/, '');
        originalDeck = merged;
        localStorage.setItem(STORAGE_KEY_LAST_DECK, currentDeckName);
        document.getElementById('deck-title').innerText = currentDeckName.split('__').pop() + " (전체)";
        
        applyFilterAndSort();
        toggleMenu();
    }

    function applyFilterAndSort() {
        if (!currentDeckName) return;
        const stats = JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}');
        let filtered = [...originalDeck];

        if (currentFilterMode !== 'default') {
            filtered = filtered.filter(c => (stats[c.id] || {})[currentFilterMode]);
        }
        if (currentSortMode === 'wrong') {
            filtered.sort((a, b) => {
                const sA = stats[a.id] || {correct:0, total:0};
                const sB = stats[b.id] || {correct:0, total:0};
                const rA = sA.total===0 ? 1 : (sA.correct/sA.total);
                const rB = sB.total===0 ? 1 : (sB.correct/sB.total);
                return rA - rB;
            });
        }

        activeDeck = filtered;
        currentIndex = loadProgress();
        if (currentIndex >= activeDeck.length) currentIndex = 0;
        
        renderDeckTree(); // 덱 선택 상태(active) 갱신
        showCard();
    }

    function showCard() {
        if (!activeDeck.length) {
            document.getElementById('question-section').innerHTML = "<h3>카드가 없습니다.</h3>";
            document.getElementById('answer-section').style.display = 'none';
            document.getElementById('click-guide').style.display = 'none';
            return;
        }
        
        const card = activeDeck[currentIndex];
        const s = getStats(card.id);
        
        document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${activeDeck.length}`;
        updateStatsUI(s); 
        
        const qDiv = document.getElementById('question-section');
        qDiv.innerHTML = card.q.replace(/\n/g, '<br>'); // 간단 텍스트 처리
        // 이미지 처리
        qDiv.innerHTML = qDiv.innerHTML.replace(/<img[^>]*src="([^"]*)"[^>]*>/g, (match, src) => {
             return `<img src="${githubRawBase + encodeURIComponent(src)}" onerror="this.style.display='none'">`;
        });

        const aDiv = document.getElementById('answer-section');
        aDiv.innerHTML = card.a.replace(/\n/g, '<br>');
        aDiv.innerHTML = aDiv.innerHTML.replace(/<img[^>]*src="([^"]*)"[^>]*>/g, (match, src) => {
             return `<img src="${githubRawBase + encodeURIComponent(src)}" onerror="this.style.display='none'">`;
        });

        aDiv.style.display = 'none';
        document.getElementById('divider').style.display = 'none';
        document.getElementById('click-guide').style.display = 'block';
        document.getElementById('grade-area').style.display = 'none';
        document.getElementById('nav-area').style.display = 'flex';
        document.getElementById('scroll-area').scrollTop = 0;
    }

    // ... (나머지 헬퍼 함수들: revealAnswer, moveCard, grade, stats 등 기존 동일) ...
    function revealAnswer() { 
        document.getElementById('click-guide').style.display = 'none'; 
        document.getElementById('divider').style.display = 'block';
        document.getElementById('answer-section').style.display = 'block'; 
        document.getElementById('grade-area').style.display = 'flex';
        document.getElementById('nav-area').style.display = 'none';
    }
    
    function moveCard(d) { 
        let n = currentIndex + d; 
        if (n >= 0 && n < activeDeck.length) { 
            currentIndex = n; 
            saveCurrentProgress(); 
            showCard(); 
        } 
    }

    function grade(score) {
        const id = activeDeck[currentIndex].id;
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}');
        if (!data[id]) data[id] = { correct: 0, total: 0, lastDate: 0 };
        
        data[id].total++;
        if (score === 2) data[id].correct++;
        else if (score === 1) data[id].correct += 0.5;
        data[id].lastDate = Date.now();
        
        localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(data));
        
        if (currentIndex < activeDeck.length - 1) {
            moveCard(1);
        } else {
            alert("학습 완료!");
            moveCard(0);
        }
    }

    function toggleMenu() { 
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        sidebar.classList.toggle('open'); 
        overlay.classList.toggle('open');
        
        // 🔥 메뉴 열 때 자동 스크롤
        if (sidebar.classList.contains('open')) {
            setTimeout(() => {
                const activeEl = document.querySelector('.tree-deck.active');
                if (activeEl) {
                    activeEl.scrollIntoView({ block: 'center', behavior: 'auto' });
                }
            }, 100);
        }
    }

    function toggleFilterBar() { document.getElementById('filter-bar').classList.toggle('open'); }
    function setFilterMode(m) { currentFilterMode=m; highlightFilter(); applyFilterAndSort(); }
    function setSortMode(m) { currentSortMode=m; highlightFilter(); applyFilterAndSort(); }
    function highlightFilter() {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        document.getElementById(`filter-${currentFilterMode}`).classList.add('active');
        document.getElementById(`sort-${currentSortMode}`).classList.add('active');
    }
    
    function saveCurrentProgress() {
        const key = `${currentDeckName}__${currentFilterMode}__${currentSortMode}`;
        const p = JSON.parse(localStorage.getItem(STORAGE_KEY_PROGRESS) || '{}');
        p[key] = currentIndex;
        localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(p));
    }
    function loadProgress() {
        const key = `${currentDeckName}__${currentFilterMode}__${currentSortMode}`;
        return JSON.parse(localStorage.getItem(STORAGE_KEY_PROGRESS) || '{}')[key] || 0;
    }
    function getStats(id) { return JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}')[id] || { correct: 0, total: 0, lastDate: 0 }; }
    function getVirtualDate(ts) { const d = new Date(ts); if(d.getHours() < 4) d.setDate(d.getDate()-1); d.setHours(0,0,0,0); return d; }
    
    function updateStatsUI(s) {
        const b = document.getElementById('rate-badge');
        if(!s.total) { b.innerText="New"; b.className="rate-badge"; }
        else { const r = Math.round((s.correct/s.total)*100); b.innerText=`${r}% (${s.total}회)`; b.className=`rate-badge ${r>=80?'high':(r<50?'low':'')}`; }
        
        const db = document.getElementById('date-badge');
        if(!s.lastDate) db.style.display='none';
        else {
            const diff = Math.floor((getVirtualDate(Date.now()) - getVirtualDate(s.lastDate)) / 86400000);
            db.style.display='inline-block';
            if (diff === 0) { db.innerText = "✅ 오늘"; db.className = 'date-badge badge-today'; }
            else if (diff === 1) { db.innerText = "⏮️ 1일 전"; db.className = 'date-badge badge-1d'; }
            else { db.innerText = `📅 ${diff}일 전`; db.className = 'date-badge badge-old'; }
        }
    }
    
    function toggleTag(e, type) { 
        e.stopPropagation(); 
        const id = activeDeck[currentIndex].id;
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY_STATS) || '{}');
        if(!data[id]) data[id] = { correct: 0, total: 0 };
        data[id][type] = !data[id][type];
        localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(data));
        // 아이콘 UI 갱신 로직 추가 필요 (생략됨)
    }

    const cyrb53 = (str, seed = 0) => { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };
</script>
